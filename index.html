<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Heaviness</title>
<meta name="description" content="The best new heavy music videos, hand-picked and updated regularly. Metal, hardcore, punk, and rock.">
<link rel="icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#0d0f14;--text:#f2f4f7;--body:#b8bec9;--label:#9aa5b1;--rule:#2a2f38;--steel:#d5dae3}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 "Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--steel)}a:hover{color:#fff}
main{max-width:1040px;margin:0 auto;padding:48px 20px 40px;display:flex;flex-direction:column;gap:28px}
.intro{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.brand{margin:0;width:100%;max-width:640px}.brand img{display:block;width:100%;height:auto}
.intro p{margin:0;max-width:620px;font-size:18px;color:var(--body)}
.player{position:relative;aspect-ratio:16/9;background:#000;border:1px solid var(--rule)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.label{font-family:"Space Grotesk",sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--label)}
.bar a{font-size:15px}
.tools{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.sort{display:flex;gap:4px}
.sort button{font:inherit;font-size:15px;color:var(--label);background:none;border:0;border-bottom:1px solid transparent;padding:0 8px;min-height:44px;cursor:pointer}
.sort button:hover{color:var(--text)}
.sort button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--steel)}
.grid{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 20px}
.week{grid-column:1/-1;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.week:not(:first-child){margin-top:20px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;text-decoration:none;color:inherit}
.thumb{display:block;aspect-ratio:16/9;overflow:hidden;background:#161a22;outline:2px solid transparent;outline-offset:3px;transition:outline-color .15s}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;opacity:.88;transition:opacity .15s}
.card:hover .thumb img,.card:focus-visible .thumb img{opacity:1}
.card[aria-current="true"] .thumb{outline-color:var(--steel)}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.artist,.song{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:16px;font-weight:600;color:var(--text)}
.song{font-size:15px;color:var(--body)}
.more-wrap{display:flex;justify-content:center;margin-top:28px}
.more{font:inherit;font-size:15px;color:var(--text);background:transparent;border:1px solid #5b6673;padding:10px 22px;min-height:44px;cursor:pointer}
.more:hover{border-color:var(--steel)}
footer{margin-top:12px;font-size:14px}
</style>
</head>
<body>
<main>
<div class="intro">
<h1 class="brand"><img src="header.png" alt="New Heaviness" width="1400" height="260"></h1>
<p>The best new heavy music videos, hand-picked and updated regularly. Metal, hardcore, punk, and rock.</p>
</div>
<div class="player"><iframe id="player" src="https://www.youtube-nocookie.com/embed/videoseries?list=PLQJf2JuUxsz0" title="New Heaviness: Latest" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></div>
<section aria-labelledby="songs-label">
<div class="bar"><span class="label"><span id="songs-label">On the playlist</span><span id="updated"></span></span><span class="tools"><span class="sort" role="group" aria-label="Order" id="sort" hidden><button type="button" data-sort="new" aria-pressed="true">New</button><button type="button" data-sort="popular" aria-pressed="false">Popular</button></span><a id="all" href="https://www.youtube.com/playlist?list=PLQJf2JuUxsz0">Open the playlist on YouTube</a></span></div>
<ul class="grid" id="grid"></ul>
<div class="more-wrap"><button class="more" id="more" type="button" hidden>Show all</button></div>
</section>
<footer><a href="privacy.html">Privacy policy</a></footer>
</main>
<script>
(function () {
  var LIST = "PLQJf2JuUxsz0", FIRST = 24;
  var grid = document.getElementById("grid"), more = document.getElementById("more");
  var player = document.getElementById("player"), all = document.getElementById("all");
  var sortBox = document.getElementById("sort");
  var songs = [], items = [], shownSongs = 0, next = 0, mode = "new";

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function day(iso) {
    return new Date(iso + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  }

  // The Sunday that starts the week of an ISO date (UTC), so one week's run and its retries group together.
  function weekOf(iso) {
    var d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() - d.getUTCDay());
    return d.toISOString().slice(0, 10);
  }

  function byViews(a, b) { return (b.vpd || 0) - (a.vpd || 0) || a.pos - b.pos; }

  // The grid's contents for the current order: song entries, plus week headings for New.
  function build() {
    if (mode === "popular") return songs.slice().sort(byViews).map(function (s) { return { song: s }; });
    if (!songs[0] || !songs[0].added) return songs.map(function (s) { return { song: s }; });
    var weeks = {}, keys = [];
    songs.forEach(function (s) {
      var k = weekOf(s.added);
      if (!weeks[k]) { weeks[k] = []; keys.push(k); }
      weeks[k].push(s);
    });
    keys.sort().reverse();
    var out = [];
    keys.forEach(function (k) {
      var group = weeks[k].sort(byViews);
      var first = group.reduce(function (m, s) { return s.added < m ? s.added : m; }, group[0].added);
      out.push({ heading: "Added " + day(first) + " · " + group.length + (group.length === 1 ? " video" : " videos") });
      group.forEach(function (s) { out.push({ song: s }); });
    });
    return out;
  }

  function card(s) {
    var li = el("li"), a = el("a", "card"), thumb = el("span", "thumb"), img = el("img"), meta = el("span", "meta");
    a.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(s.id) + "&list=" + LIST;
    a.dataset.pos = s.pos;
    a.setAttribute("aria-label", "Play " + s.artist + " – " + s.song);
    img.src = "https://i.ytimg.com/vi/" + encodeURIComponent(s.id) + "/mqdefault.jpg";
    img.alt = ""; img.loading = "lazy"; img.width = 320; img.height = 180;
    thumb.appendChild(img);
    meta.appendChild(el("span", "artist", s.artist));
    meta.appendChild(el("span", "song", s.song));
    a.appendChild(thumb); a.appendChild(meta); li.appendChild(a);
    return li;
  }

  // Adds entries until `limit` songs are showing (a heading is added with the songs under it).
  function render(limit) {
    var frag = document.createDocumentFragment();
    while (next < items.length) {
      var it = items[next];
      if (shownSongs >= limit) break;
      if (it.heading) {
        frag.appendChild(el("li", "week label", it.heading));
      } else {
        frag.appendChild(card(it.song));
        shownSongs++;
      }
      next++;
    }
    grid.appendChild(frag);
    more.hidden = shownSongs >= songs.length;
  }

  function show(newMode) {
    mode = newMode;
    Array.prototype.forEach.call(sortBox.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.sort === mode));
    });
    grid.textContent = "";
    items = build(); next = 0; shownSongs = 0;
    // Show at least the whole newest week.
    var firstWeek = 0;
    if (items[0] && items[0].heading) {
      for (var i = 1; i < items.length && items[i].song; i++) firstWeek++;
    }
    render(Math.max(FIRST, firstWeek));
  }

  sortBox.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-sort]");
    if (b && b.dataset.sort !== mode) show(b.dataset.sort);
  });

  grid.addEventListener("click", function (e) {
    var a = e.target.closest("a.card");
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    var pos = +a.dataset.pos;
    player.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(songs[pos].id) +
      "?list=" + LIST + "&index=" + (pos + 1) + "&autoplay=1";
    var cur = grid.querySelector('[aria-current="true"]');
    if (cur) cur.removeAttribute("aria-current");
    a.setAttribute("aria-current", "true");
    player.scrollIntoView({ behavior: "smooth", block: "center" });
  });

  more.addEventListener("click", function () { render(songs.length); });

  fetch("songs.json", { cache: "no-cache" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      songs = d.songs || [];
      if (!songs.length) return;
      songs.forEach(function (s, i) { s.pos = i; });
      more.textContent = "Show all " + songs.length;
      all.textContent = "All " + songs.length + " on YouTube";
      if (d.updated) document.getElementById("updated").textContent = " · Updated " + day(d.updated);
      sortBox.hidden = songs[0].vpd === undefined;
      show("new");
    })
    .catch(function () {});
})();
</script>
</body>
</html>
