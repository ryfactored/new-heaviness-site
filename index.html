<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>New Heaviness</title>
<meta name="description" content="The best new heavy music videos, hand-picked and updated regularly. Metal, hardcore, punk, and rock.">
<link rel="icon" href="icon.png">
<link rel="canonical" href="https://newheaviness.com/"><meta property="og:type" content="website">
<meta property="og:site_name" content="New Heaviness">
<meta property="og:title" content="New Heaviness">
<meta property="og:description" content="The best new heavy music videos, hand-picked and updated regularly. Metal, hardcore, punk, and rock.">
<meta property="og:url" content="https://newheaviness.com/">
<meta property="og:image" content="https://newheaviness.com/og.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="New Heaviness: the best new heavy music videos">
<meta name="twitter:card" content="summary_large_image">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap">
<style>
:root{color-scheme:dark;--bg:#0d0f14;--text:#f2f4f7;--body:#b8bec9;--label:#9aa5b1;--rule:#2a2f38;--steel:#d5dae3}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.6 "Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:var(--steel)}a:hover{color:#fff}
main{max-width:1040px;margin:0 auto;padding:48px 20px 40px;display:flex;flex-direction:column;gap:28px}
.intro{display:flex;flex-direction:column;align-items:center;gap:20px;text-align:center}
.brand{margin:0;width:100%;max-width:640px}.brand img{display:block;width:100%;height:auto}
.intro p{margin:0;max-width:620px;font-size:18px;color:var(--body)}
.intro .follow{display:flex;gap:12px;align-items:center;flex-wrap:wrap;justify-content:center;margin-top:-8px;font-size:15px;color:var(--label)}
.player{position:relative;aspect-ratio:16/9;background:#000;border:1px solid var(--rule)}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.bar{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;padding-bottom:12px;border-bottom:1px solid var(--rule)}
.label{font-family:"Space Grotesk",sans-serif;font-size:12px;letter-spacing:.18em;text-transform:uppercase;color:var(--label)}
.bar a{font-size:15px}
.tools{display:flex;align-items:center;gap:20px;flex-wrap:wrap}
.sort{display:flex;gap:4px}
.sort button{font:inherit;font-size:15px;color:var(--label);background:none;border:0;border-bottom:1px solid transparent;padding:0 8px;min-height:44px;cursor:pointer}
.sort button:hover{color:var(--text)}
.sort button[aria-pressed="true"]{color:var(--text);border-bottom-color:var(--steel)}
.search{display:flex;align-items:center}
.search-btn{display:inline-flex;align-items:center;justify-content:center;min-width:44px;min-height:44px;padding:0;color:var(--label);background:none;border:0;cursor:pointer}
.search-btn:hover,.search-btn:focus-visible,.search-btn[aria-expanded="true"]{color:var(--text)}
.search-btn{border-bottom:1px solid transparent}
.search-btn[aria-expanded="true"]{border-bottom-color:var(--steel)}
.search-row{display:flex;align-items:center;flex-wrap:wrap;gap:4px 16px;margin-top:16px}
.search-box{display:flex;align-items:center;flex:1 1 260px;min-width:0;border-bottom:1px solid var(--steel)}
.search-box input{flex:1;min-width:0;font:inherit;font-size:15px;color:var(--text);background:transparent;border:0;outline:0;min-height:44px;padding:0 4px}
.search-box input::placeholder{color:var(--label)}
.search-box button{font:inherit;font-size:20px;line-height:1;color:var(--label);background:none;border:0;min-width:36px;min-height:44px;cursor:pointer}
.search-box button:hover{color:var(--text)}
.status{margin:0;font-size:15px;color:var(--body)}
.grid{list-style:none;margin:24px 0 0;padding:0;display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:28px 20px}
.week{grid-column:1/-1;padding-bottom:8px;border-bottom:1px solid var(--rule)}
.week:not(:first-child){margin-top:20px}
.card{display:flex;flex-direction:column;gap:10px;min-width:0;text-decoration:none;color:inherit}
.thumb{display:block;aspect-ratio:16/9;overflow:hidden;background:#161a22;outline:2px solid transparent;outline-offset:3px;transition:outline-color .15s}
.thumb img{display:block;width:100%;height:100%;object-fit:cover;opacity:.88;transition:opacity .15s}
.card:hover .thumb img,.card:focus-visible .thumb img{opacity:1}
.card[aria-current="true"] .thumb{outline-color:var(--steel)}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.artist,.song{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.artist{font-size:16px;font-weight:600;color:var(--text)}
.song{font-size:15px;color:var(--body)}
.more-wrap{display:flex;justify-content:center;margin-top:28px}
.more{font:inherit;font-size:15px;color:var(--text);background:transparent;border:1px solid #5b6673;padding:10px 22px;min-height:44px;cursor:pointer}
.more:hover{border-color:var(--steel)}
footer{margin-top:12px;font-size:14px}
</style>
</head>
<body>
<main>
<div class="intro">
<h1 class="brand"><img src="header.png" alt="New Heaviness" width="1400" height="260"></h1>
<p>The best new heavy music videos, hand-picked and updated regularly. Metal, hardcore, punk, and rock.</p>
<p class="follow"><a href="https://www.youtube.com/@newheaviness?sub_confirmation=1">Follow on YouTube</a></p>
</div>
<div class="player"><div id="player"></div><noscript><iframe src="https://www.youtube-nocookie.com/embed/videoseries?list=PLQJf2JuUxsz0" title="New Heaviness: Latest" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe></noscript></div>
<section aria-labelledby="songs-label">
<div class="bar"><span class="label"><span id="songs-label">On the playlist</span><span id="updated"></span></span><span class="tools"><span class="search" id="search" hidden><button type="button" class="search-btn" id="search-open" aria-label="Search the playlist" aria-expanded="false" aria-controls="search-row" title="Search (/)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg></button></span><span class="sort" role="group" aria-label="Order" id="sort" hidden><button type="button" data-sort="new" aria-pressed="true">New</button><button type="button" data-sort="popular" aria-pressed="false">Popular</button></span><a id="all" href="https://www.youtube.com/playlist?list=PLQJf2JuUxsz0">Open the playlist on YouTube</a></span></div>
<div class="search-row" id="search-row" hidden><span class="search-box"><input id="q" type="text" placeholder="Band or song" aria-label="Search the playlist by band or song" autocomplete="off" spellcheck="false"><button type="button" id="search-clear" aria-label="Clear search">×</button></span><p class="status" id="status" role="status" aria-live="polite"></p></div>
<ul class="grid" id="grid"></ul>
<div class="more-wrap"><button class="more" id="more" type="button" hidden>Show all</button></div>
</section>
<footer><a href="privacy.html">Privacy policy</a></footer>
</main>
<script>
(function () {
  var LIST = "PLQJf2JuUxsz0", FIRST = 24;
  var grid = document.getElementById("grid"), more = document.getElementById("more");
  var all = document.getElementById("all");
  var sortBox = document.getElementById("sort");
  var songs = [], items = [], shownSongs = 0, totalSongs = 0, next = 0, mode = "new", query = "";
  var search = document.getElementById("search"), openBtn = document.getElementById("search-open");
  var box = document.getElementById("search-row"), input = document.getElementById("q");
  var status = document.getElementById("status");

  // Lowercase without accents, so "touche" finds "Touché Amoré".
  function fold(s) { return (s || "").normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase(); }

  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text) e.textContent = text;
    return e;
  }

  function day(iso) {
    return new Date(iso + "T00:00:00Z").toLocaleDateString("en-US", { month: "short", day: "numeric", timeZone: "UTC" });
  }

  // The Sunday that starts the week of an ISO date (UTC), so one week's run and its retries group together.
  function weekOf(iso) {
    var d = new Date(iso + "T00:00:00Z");
    d.setUTCDate(d.getUTCDate() - d.getUTCDay());
    return d.toISOString().slice(0, 10);
  }

  function byViews(a, b) { return (b.vpd || 0) - (a.vpd || 0) || a.pos - b.pos; }

  // The grid's contents for the current order: song entries, plus week headings for New.
  // With a search, only the matching songs (and the weeks that have any).
  function build(all) {
    var list = all || !query ? songs : songs.filter(function (s) { return s.key.indexOf(query) >= 0; });
    if (mode === "popular") return list.slice().sort(byViews).map(function (s) { return { song: s }; });
    if (!list[0] || !list[0].added) return list.map(function (s) { return { song: s }; });
    var weeks = {}, keys = [];
    list.forEach(function (s) {
      var k = weekOf(s.added);
      if (!weeks[k]) { weeks[k] = []; keys.push(k); }
      weeks[k].push(s);
    });
    keys.sort().reverse();
    var out = [];
    keys.forEach(function (k) {
      // The first video on the playlist is the week's featured pick (chosen in the weekly PR): it leads its week.
      var group = weeks[k].sort(function (a, b) { return (a.pos === 0 ? -1 : b.pos === 0 ? 1 : byViews(a, b)); });
      var first = group.reduce(function (m, s) { return s.added < m ? s.added : m; }, group[0].added);
      out.push({ heading: "Added " + day(first) + " · " + group.length + (group.length === 1 ? " video" : " videos") });
      group.forEach(function (s) { out.push({ song: s }); });
    });
    return out;
  }

  function card(s) {
    var li = el("li"), a = el("a", "card"), thumb = el("span", "thumb"), img = el("img"), meta = el("span", "meta");
    a.href = "https://www.youtube.com/watch?v=" + encodeURIComponent(s.id) + "&list=" + LIST;
    a.dataset.pos = s.pos;
    a.setAttribute("aria-label", "Play " + s.artist + " – " + s.song);
    img.src = "https://i.ytimg.com/vi/" + encodeURIComponent(s.id) + "/mqdefault.jpg";
    img.alt = ""; img.loading = "lazy"; img.width = 320; img.height = 180;
    thumb.appendChild(img);
    meta.appendChild(el("span", "artist", s.artist));
    meta.appendChild(el("span", "song", s.song));
    a.appendChild(thumb); a.appendChild(meta); li.appendChild(a);
    return li;
  }

  // Adds entries until `limit` songs are showing (a heading is added with the songs under it).
  function render(limit) {
    var frag = document.createDocumentFragment();
    while (next < items.length) {
      var it = items[next];
      if (shownSongs >= limit) break;
      if (it.heading) {
        frag.appendChild(el("li", "week label", it.heading));
      } else {
        frag.appendChild(card(it.song));
        shownSongs++;
      }
      next++;
    }
    grid.appendChild(frag);
    more.hidden = shownSongs >= totalSongs;
  }

  // Redraws the grid for the current order and search. The player's queue is left alone.
  function draw() {
    grid.textContent = "";
    items = build(); next = 0; shownSongs = 0;
    totalSongs = items.filter(function (it) { return it.song; }).length;
    if (query) {
      status.textContent = totalSongs ? totalSongs + (totalSongs === 1 ? " match" : " matches")
        : "Nothing on Latest matches “" + input.value.trim() + "”";
      render(Infinity);
      return;
    }
    status.textContent = "";
    // Show at least the whole newest week.
    var firstWeek = 0;
    if (items[0] && items[0].heading) {
      for (var i = 1; i < items.length && items[i].song; i++) firstWeek++;
    }
    render(Math.max(FIRST, firstWeek));
  }

  function show(newMode) {
    mode = newMode;
    Array.prototype.forEach.call(sortBox.querySelectorAll("button"), function (b) {
      b.setAttribute("aria-pressed", String(b.dataset.sort === mode));
    });
    draw();
    queue();
  }

  // The search opens as its own row under the header, so nothing in the header moves.
  function openSearch() {
    box.hidden = false; openBtn.setAttribute("aria-expanded", "true"); input.focus();
  }

  function closeSearch() {
    input.value = ""; box.hidden = true; openBtn.setAttribute("aria-expanded", "false");
    if (query) { query = ""; draw(); }
    openBtn.focus();
  }

  // The player plays in the order on screen, through the YouTube IFrame API.
  // A queue holds at most 200 videos, so it starts from the chosen video.
  var MAX_QUEUE = 200, yt = null, ytReady = false, playWhenCued = false, fallback = false;

  // The whole list in the current order, whatever the search shows: a match plays on into the rest.
  function order() {
    return build(true).filter(function (it) { return it.song; }).map(function (it) { return it.song.id; });
  }

  // Without the API (blocked or slow), a plain embed with the same order.
  function embed(ids, autoplay) {
    if (!ids.length) return;
    var frame = document.getElementById("player");
    if (frame.tagName !== "IFRAME") {
      var f = document.createElement("iframe");
      f.id = "player"; f.title = "New Heaviness player"; f.allowFullscreen = true;
      f.allow = "accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share";
      f.referrerPolicy = "strict-origin-when-cross-origin";
      frame.replaceWith(f); frame = f;
    }
    frame.src = "https://www.youtube-nocookie.com/embed/" + encodeURIComponent(ids[0]) + "?playlist=" +
      ids.slice(0, MAX_QUEUE).map(encodeURIComponent).join(",") + (autoplay ? "&autoplay=1" : "");
  }

  function cue(ids, at, autoplay) {
    playWhenCued = autoplay;
    yt.cuePlaylist(ids, 0, at || 0);
    // In case the player reports no "cued" state (e.g. the same list again).
    if (autoplay) setTimeout(function () { if (playWhenCued) { playWhenCued = false; yt.playVideo(); } }, 1500);
  }

  function play(id) {
    var ids = order(), slice = ids.slice(Math.max(0, ids.indexOf(id)), Math.max(0, ids.indexOf(id)) + MAX_QUEUE);
    if (ytReady) cue(slice, 0, true); else embed(slice, true);
  }

  // After a reorder: a video that is playing or paused keeps its place, with the new order behind it.
  function queue() {
    if (!items.length) return;
    var ids = order();
    if (!ytReady) { if (fallback) embed(ids, false); return; }
    var state = yt.getPlayerState();
    if (state !== 1 && state !== 2 && state !== 3) { cue(ids.slice(0, MAX_QUEUE), 0, false); return; }
    var current = (yt.getVideoData() || {}).video_id, i = Math.max(0, ids.indexOf(current));
    cue(ids.slice(i, i + MAX_QUEUE), yt.getCurrentTime() || 0, state !== 2);
  }

  window.onYouTubeIframeAPIReady = function () {
    if (fallback) return;
    yt = new YT.Player("player", {
      host: "https://www.youtube-nocookie.com",
      playerVars: { playsinline: 1, rel: 0 },
      events: {
        onReady: function () { ytReady = true; yt.getIframe().title = "New Heaviness player"; queue(); },
        onStateChange: function (e) { if (e.data === 5 && playWhenCued) { playWhenCued = false; yt.playVideo(); } }
      }
    });
  };
  var api = document.createElement("script");
  api.src = "https://www.youtube.com/iframe_api";
  document.head.appendChild(api);
  setTimeout(function () { if (!yt) { fallback = true; queue(); } }, 8000);

  sortBox.addEventListener("click", function (e) {
    var b = e.target.closest("button[data-sort]");
    if (b && b.dataset.sort !== mode) show(b.dataset.sort);
  });

  grid.addEventListener("click", function (e) {
    var a = e.target.closest("a.card");
    if (!a || e.metaKey || e.ctrlKey || e.shiftKey || e.button !== 0) return;
    e.preventDefault();
    play(songs[+a.dataset.pos].id);
    var cur = grid.querySelector('[aria-current="true"]');
    if (cur) cur.removeAttribute("aria-current");
    a.setAttribute("aria-current", "true");
    document.querySelector(".player").scrollIntoView({ behavior: "smooth", block: "center" });
  });

  more.addEventListener("click", function () { render(songs.length); });

  openBtn.addEventListener("click", function () { if (box.hidden) openSearch(); else closeSearch(); });
  document.getElementById("search-clear").addEventListener("click", closeSearch);
  input.addEventListener("input", function () {
    var q = fold(input.value.trim());
    if (q !== query) { query = q; draw(); }
  });
  input.addEventListener("keydown", function (e) { if (e.key === "Escape") closeSearch(); });
  document.addEventListener("keydown", function (e) {
    var t = e.target, typing = t && (t.tagName === "INPUT" || t.tagName === "TEXTAREA" || t.isContentEditable);
    if (e.key === "/" && !typing && !e.ctrlKey && !e.metaKey && !e.altKey && !search.hidden) {
      e.preventDefault();
      openSearch();
    }
  });

  fetch("songs.json", { cache: "no-cache" })
    .then(function (r) { return r.json(); })
    .then(function (d) {
      songs = d.songs || [];
      if (!songs.length) return;
      songs.forEach(function (s, i) { s.pos = i; s.key = fold(s.artist + "\n" + s.song); });
      search.hidden = false;
      more.textContent = "Show all " + songs.length;
      all.textContent = "All " + songs.length + " on YouTube";
      if (d.updated) document.getElementById("updated").textContent = " · Updated " + day(d.updated);
      sortBox.hidden = songs[0].vpd === undefined;
      show("new");
    })
    .catch(function () {});
})();
</script>
</body>
</html>
