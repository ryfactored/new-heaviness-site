name: songs
on:
  schedule:
    - cron: "30 12 * * *"   # daily, after the main repo's playlist sync at 12:00 UTC
  workflow_dispatch:
  repository_dispatch:
    types: [playlist-updated]
permissions:
  contents: write
concurrency:
  group: songs
  cancel-in-progress: false
jobs:
  songs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Update songs.json
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python scripts/update_songs.py
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add songs.json
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "songs: update from the Latest playlist"
          git push
